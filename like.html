---
title: Youngji Sohn - I like
layout: simple
noindex: true
---
<style>.page-wrapper{max-width: 500px;}</style>

<div class="col-mini">

  <div class="box-subtle-header" id="birds-header" style="position:relative;">
    <span id="birds-label">birds</span>
    <span id="birds-menu" style="display:none;"></span>
  </div>
  <div class="box-subtle" id="birds-box" style="text-align:center; position:relative;">
    <img id="random-img" alt="Random" style="max-width:100%; max-height:700px; width:auto; border:2px solid #555; display:none;" draggable="false" oncontextmenu="return false;">
    <video id="random-vid" autoplay muted loop controls playsinline style="max-width:100%; max-height:700px; width:auto; border:2px solid #555; display:none;" draggable="false" oncontextmenu="return false;"></video>
    <div id="yt-wrap" style="display:none;">
      <iframe id="yt-frame" allow="autoplay; encrypted-media" allowfullscreen frameborder="0"></iframe>
    </div>
    <div id="bird-controls" style="margin-top:8px; font-size:13px; color:#888; display:none;">
      <span id="bird-sound" class="ctl">&#128263; sound off</span>
      <span style="margin:0 6px;">&middot;</span>
      <span id="bird-next" class="ctl">next &rsaquo;</span>
    </div>
  </div>

  <div class="box-subtle-header" id="snippet-header" style="margin-top: 20px; display:none;"></div>
  <div class="box-subtle" id="snippet-box" style="display:none;"></div>

  <div class="box-subtle-header" style="margin-top: 20px;" id="name">my name</div>
  <div class="box-subtle">
    <p>My name is Youngji Sohn, written as <a href="https://en.wikipedia.org/wiki/Hangul" title="&quot;the best&quot;" target="_blank" class="plain">손 영지</a>.
      The first is my family name, and the latter is my given name.
      My late grandfather gave me this name.</p>
    <p>It's pronounced roughly "young-jee."</p>
  </div>

</div>

<script>
// --- Data arrays ---
var birds = [
  {% for file in site.static_files %}
    {% if file.path contains 'assets/birds/' %}
      {% assign fname = file.name | slice: 0, 3 %}
      {% unless fname == 'xxx' %}
        {% if file.extname == '.jpg' or file.extname == '.JPG' or file.extname == '.jpeg' or file.extname == '.JPEG' or file.extname == '.png' or file.extname == '.PNG' or file.extname == '.webp' or file.extname == '.WEBP' or file.extname == '.mp4' or file.extname == '.MP4' or file.extname == '.mov' or file.extname == '.MOV' or file.extname == '.txt' or file.extname == '.TXT' %}
          {path: '{{ file.path }}', type: '{{ file.extname }}'},
        {% endif %}
      {% endunless %}
    {% endif %}
  {% endfor %}
];
   
var snippets = [
  {% for file in site.static_files %}
    {% if file.path contains 'assets/snippets/' %}
      {% unless file.path contains 'assets/snippets/drafts/' %}
        {% if file.extname == '.html' %}
          {% assign fname = file.name | slice: 0, 3 %}
          {% unless fname == 'xxx' %}
            '{{ file.path }}',
          {% endunless %}
        {% endif %}
      {% endunless %}
    {% endif %}
  {% endfor %}
];

// --- Rotation picker (shuffle bag: no repeat until the whole pool is shown) ---
function pickRandom(items, key, exclude) {
  var getId = function(item) { return typeof item === 'string' ? item : item.path; };
  var seen = JSON.parse(sessionStorage.getItem(key) || '[]');
  var unseen = items.filter(function(item) { return !seen.includes(getId(item)); });
  if (unseen.length === 0) { seen = []; unseen = items; }
  if (exclude) {
    var filtered = unseen.filter(function(item) { return getId(item) !== exclude; });
    if (filtered.length > 0) unseen = filtered;
  }
  var pick = unseen[Math.floor(Math.random() * unseen.length)];
  seen.push(getId(pick));
  sessionStorage.setItem(key, JSON.stringify(seen));
  return pick;
}

// --- Birds: country > subfolder menu; randomize within a subfolder ---
if (birds.length > 0) {

  function dirsOf(path) {
    var rest = (path.split('assets/birds/')[1] || '');
    var segs = rest.split('/');
    segs.pop();                         // drop the filename
    return segs;                        // dir segments under assets/birds/
  }
  // country = 1st folder, subfolder = 2nd; a country with loose files (no 2nd folder)
  // is treated as its own single subfolder.
  function leafInfo(path) {
    var d = dirsOf(path);
    if (d.length >= 2) return { country: d[0], sub: d[1], key: d[0] + '/' + d[1] };
    if (d.length === 1) return { country: d[0], sub: d[0], key: d[0] };
    return { country: '(misc)', sub: '(misc)', key: '(misc)' };
  }
  function ytId(url) {
    var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([\w-]{11})/);
    return m ? m[1] : null;
  }
  function cleanLabel(s) {
    return s === '(misc)' ? 'misc' : s.replace(/[-_]+/g, ' ');
  }

  // group into leaves (= subfolders); remember each leaf's country + city label
  var leaves = {};          // key -> [birds]
  var leafCountry = {};     // key -> country
  var leafSub = {};         // key -> city / sub label
  var countryLeaves = {};   // country -> [key, ...] in menu order
  birds.forEach(function(b) {
    var info = leafInfo(b.path);
    (leaves[info.key] = leaves[info.key] || []).push(b);
    leafCountry[info.key] = info.country;
    leafSub[info.key] = info.sub;
    (countryLeaves[info.country] = countryLeaves[info.country] || []);
    if (countryLeaves[info.country].indexOf(info.key) === -1)
      countryLeaves[info.country].push(info.key);
  });
  var leafKeys = Object.keys(leaves);        // ALL subfolders — the cross-folder random pool
  var countryNames = Object.keys(countryLeaves);

  var birdsHeader = document.getElementById('birds-header');
  var birdsLabel  = document.getElementById('birds-label');
  var birdsMenu   = document.getElementById('birds-menu');
  var box      = document.getElementById('birds-box');
  var img      = document.getElementById('random-img');
  var vid      = document.getElementById('random-vid');
  var ytWrap   = document.getElementById('yt-wrap');
  var ytFrame  = document.getElementById('yt-frame');
  var controls = document.getElementById('bird-controls');
  var soundBtn = document.getElementById('bird-sound');
  var nextBtn  = document.getElementById('bird-next');

  var currentPath = null;
  var currentKind = 'image';
  var prefetchedLeaf = null;
  var wantSound = false;
  var skipCount = 0;

  // current subfolder (persists across reloads); default to a random one
  var currentLeaf = sessionStorage.getItem('currentLeaf');
  if (!currentLeaf || !leaves[currentLeaf]) {
    currentLeaf = leafKeys[Math.floor(Math.random() * leafKeys.length)];
    sessionStorage.setItem('currentLeaf', currentLeaf);
  }

  function pickInLeaf(lastPath) {
    return pickRandom(leaves[currentLeaf], 'seenLeaf:' + currentLeaf, lastPath);
  }

  // "next" / image click: stay in the subfolder until it is exhausted, then jump to a
  // random DIFFERENT subfolder chosen across ALL subfolders (country grouping ignored).
  function pickNext(lastPath) {
    var sg = JSON.parse(sessionStorage.getItem('seenLeaf:' + currentLeaf) || '[]');
    var hasUnseen = leaves[currentLeaf].some(function(b) { return sg.indexOf(b.path) === -1; });
    if (!hasUnseen) {
      currentLeaf = pickRandom(leafKeys, 'seenLeaves', currentLeaf);
      sessionStorage.setItem('currentLeaf', currentLeaf);
      highlightMenu();
    }
    return pickRandom(leaves[currentLeaf], 'seenLeaf:' + currentLeaf, lastPath);
  }

  function prefetchLeaf(key) {
    if (prefetchedLeaf === key) return;
    prefetchedLeaf = key;
    (leaves[key] || []).forEach(function(b) { fetch(b.path).catch(function(){}); });
  }

  function sizePage() {
    var w = this.naturalWidth  || this.videoWidth;
    var h = this.naturalHeight || this.videoHeight;
    document.querySelector('.page-wrapper').style.maxWidth = (w > h) ? '800px' : '500px';
  }

  function updateSoundLabel() {
    soundBtn.innerHTML = wantSound ? '&#128266; sound on' : '&#128263; sound off';
  }
  function applySound() {
    if (currentKind === 'video') {
      vid.muted = !wantSound;
    } else if (currentKind === 'youtube') {
      var func = wantSound ? 'unMute' : 'mute';
      try {
        ytFrame.contentWindow.postMessage(
          JSON.stringify({ event: 'command', func: func, args: [] }), '*');
      } catch (e) {}
    }
  }

  function stopLocalVideo() {
    vid.pause(); vid.removeAttribute('src'); vid.load(); vid.style.display = 'none';
  }
  function stopYoutube() {
    ytFrame.removeAttribute('src'); ytWrap.style.display = 'none';
  }

  function show(bird) {
    currentPath = bird.path;
    var isVideo   = /\.(mp4|mov)$/i.test(bird.path);
    var isYoutube = /\.txt$/i.test(bird.path);

    if (isYoutube) {
      currentKind = 'youtube';
      img.style.display = 'none';
      stopLocalVideo();
      box.style.cursor = 'default';
      box.removeAttribute('title');
      fetch(bird.path)
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + bird.path);
          return r.text();
        })
        .then(function(txt) {
          var id = ytId(txt.trim());
          if (!id) {
            console.warn('like.html: no YouTube id in ' + bird.path + ' — got:', JSON.stringify(txt.slice(0, 120)));
            if (skipCount++ < birds.length) advance(); else stopYoutube();
            return;
          }
          skipCount = 0;
          ytFrame.onload = function() {
            // some browsers ignore the autoplay param; nudge it via the iframe API
            try {
              ytFrame.contentWindow.postMessage(
                JSON.stringify({ event: 'command', func: 'playVideo', args: [] }), '*');
            } catch (e) {}
            applySound();
          };
          ytFrame.src = 'https://www.youtube.com/embed/' + id +
            '?autoplay=1&mute=1&loop=1&playlist=' + id + '&rel=0&playsinline=1&enablejsapi=1';
          ytWrap.style.display = '';
          controls.style.display = '';
          updateSoundLabel();
          document.querySelector('.page-wrapper').style.maxWidth = '800px';
        })
        .catch(function(err) {
          console.warn('like.html: could not load ' + bird.path, err);
          if (skipCount++ < birds.length) advance(); else stopYoutube();
        });

    } else if (isVideo) {
      currentKind = 'video';
      skipCount = 0;
      img.style.display = 'none';
      stopYoutube();
      box.style.cursor = 'default';
      box.removeAttribute('title');
      vid.src = bird.path;
      vid.muted = !wantSound;
      vid.style.display = '';
      vid.onloadedmetadata = sizePage;
      controls.style.display = '';
      updateSoundLabel();

    } else { // image
      currentKind = 'image';
      skipCount = 0;
      stopLocalVideo();
      stopYoutube();
      controls.style.display = 'none';
      box.style.cursor = 'pointer';
      box.title = 'click for the next one';
      img.src = bird.path;
      img.style.display = '';
      img.onload = sizePage;
    }
    prefetchLeaf(currentLeaf);
  }

  function advance() { show(pickNext(currentPath)); }

  // ---- country > subfolder menu ----
  function selectLeaf(key) {
    currentLeaf = key;
    sessionStorage.setItem('currentLeaf', key);
    highlightMenu();
    closeMenu();
    show(pickInLeaf(currentPath));
  }
  function closeMenu() {
    birdsMenu.style.display = 'none';
    Array.prototype.forEach.call(birdsMenu.querySelectorAll('.bird-country.open'),
      function(c) { c.classList.remove('open'); });
  }
  // accent the country of the current photo, and (inside an open submenu) its subfolder
  function highlightMenu() {
    var curCountry = leafCountry[currentLeaf];
    Array.prototype.forEach.call(birdsMenu.querySelectorAll('.bird-country'), function(c) {
      c.classList.toggle('active', c.getAttribute('data-country') === curCountry);
    });
    Array.prototype.forEach.call(birdsMenu.querySelectorAll('.bird-sub'), function(s) {
      s.classList.toggle('active', s.getAttribute('data-leaf') === currentLeaf);
    });
  }

  if (leafKeys.length > 1) {
    countryNames.forEach(function(country) {
      var keys = countryLeaves[country];
      var item = document.createElement('div');
      item.className = 'bird-country bird-folder';
      item.setAttribute('data-country', country);

      if (keys.length === 1) {
        // only one subfolder for this country -> standalone item, labelled by its city name
        var only = keys[0];
        item.textContent = cleanLabel(leafSub[only]);
        item.setAttribute('data-leaf', only);
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          selectLeaf(only);
        });
      } else {
        // multiple subfolders -> country row that opens a submenu to its right
        //item.textContent = cleanLabel(country) + ' ';
        //var caret = document.createElement('span');
        //caret.className = 'bird-caret';
        //caret.innerHTML = '&rsaquo;';
        //item.appendChild(caret);
        item.textContent = cleanLabel(country);
        
        var submenu = document.createElement('div');
        submenu.className = 'bird-submenu';
        keys.forEach(function(key) {
          var s = document.createElement('span');
          s.className = 'bird-sub bird-folder';
          s.textContent = cleanLabel(leafSub[key]);
          s.setAttribute('data-leaf', key);
          s.addEventListener('click', function(e) {
            e.stopPropagation();
            selectLeaf(key);
          });
          submenu.appendChild(s);
        });
        item.appendChild(submenu);

        item.addEventListener('click', function(e) {
          e.stopPropagation();
          var wasOpen = item.classList.contains('open');
          Array.prototype.forEach.call(birdsMenu.querySelectorAll('.bird-country.open'),
            function(c) { c.classList.remove('open'); });
          if (!wasOpen) { item.classList.add('open'); highlightMenu(); }
        });
      }
      birdsMenu.appendChild(item);
    });

    birdsLabel.style.cursor = 'pointer';
    birdsLabel.title = 'choose a folder';
    birdsLabel.addEventListener('click', function(e) {
      e.stopPropagation();
      if (birdsMenu.style.display !== 'none') { closeMenu(); return; }
      birdsMenu.style.display = '';
      highlightMenu();
      // also open the submenu for the current photo's place (if it has one)
      var curCountry = leafCountry[currentLeaf];
      Array.prototype.forEach.call(birdsMenu.querySelectorAll('.bird-country'), function(c) {
        c.classList.toggle('open',
          c.getAttribute('data-country') === curCountry && !!c.querySelector('.bird-submenu'));
      });
    });
    document.addEventListener('click', function(e) {   // click outside closes the menu
      if (!birdsHeader.contains(e.target)) closeMenu();
    });
  }

  // ---- interactions ----
  box.addEventListener('click', function() {            // images advance on click
    if (currentKind === 'image') advance();
  });
  nextBtn.addEventListener('click', function(e) {       // video / YouTube advance via button
    e.stopPropagation();
    advance();
  });
  soundBtn.addEventListener('click', function(e) {      // sound on/off
    e.stopPropagation();
    wantSound = !wantSound;
    applySound();
    updateSoundLabel();
  });

  show(pickInLeaf(null));                              // first item on load

} else {
  document.getElementById('birds-header').style.display = 'none';
  document.getElementById('birds-box').style.display = 'none';
}


// --- PDF first-page preview ---
var PDFJS_SRC    = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var pdfLibPromise = null;

function loadPdfLib() {
  if (pdfLibPromise) return pdfLibPromise;
  pdfLibPromise = new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.src = PDFJS_SRC;
    s.onload = function() {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      resolve(window.pdfjsLib);
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return pdfLibPromise;
}

function renderPdfPreview(url, mountBefore) {
  loadPdfLib()
    .then(function(lib) { return lib.getDocument(url).promise; })
    .then(function(pdf) { return pdf.getPage(1); })
    .then(function(page) {
      var base = page.getViewport({ scale: 1 });
      var viewport = page.getViewport({ scale: 900 / base.width });

      var canvas = document.createElement('canvas');
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      canvas.style.cssText =
        'width:100%; height:auto; ' +
        'border:2px solid #555; display:block; margin:0 auto 10px auto;';

      var link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.appendChild(canvas);
      mountBefore.parentNode.insertBefore(link, mountBefore);

      return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
    })
    .catch(function() {});
}

// --- Snippets: click the title to load the next one (random, no repeat until all shown) ---
if (snippets.length > 0) {
  var header = document.getElementById('snippet-header');
  var sbox = document.getElementById('snippet-box');
  var currentSnippet = null;

  function showSnippet(path) {
    currentSnippet = path;
    fetch(path)
      .then(function(r) { return r.text(); })
      .then(function(t) {
        var m = t.match(/<!--\s*title:\s*([\s\S]+?)-->/);
        var title = m
          ? m[1].trim()
          : path.split('/').pop().replace(/\.html$/i, '').replace(/[-_]/g, ' ');
        var content = t.replace(/<!--\s*title:[\s\S]+?-->/, '').trim();

        header.textContent = title;
        sbox.innerHTML = content;
        header.style.display = '';
        sbox.style.display = '';

        var pdfLink = sbox.querySelector('a[href$=".pdf" i]');
        if (pdfLink) {
          renderPdfPreview(pdfLink.getAttribute('href'), sbox.firstChild);
        }

        var next = pickRandom(snippets, 'seenSnippets', path);
        sessionStorage.setItem('nextSnippet', next);
        fetch(next).catch(function(){});
      })
      .catch(function() {
        header.style.display = 'none';
        sbox.style.display = 'none';
      });
  }

  function advanceSnippet() {
    var next = sessionStorage.getItem('nextSnippet');
    if (next) { sessionStorage.removeItem('nextSnippet'); }
    else { next = pickRandom(snippets, 'seenSnippets', currentSnippet); }
    showSnippet(next);
  }

  var first = sessionStorage.getItem('nextSnippet');
  if (first) { sessionStorage.removeItem('nextSnippet'); }
  else { first = pickRandom(snippets, 'seenSnippets'); }
  showSnippet(first);

  if (snippets.length > 1) {
    header.style.cursor = 'pointer';
    header.title = 'click for the next one';
    header.addEventListener('click', advanceSnippet);
  }
}
</script>
